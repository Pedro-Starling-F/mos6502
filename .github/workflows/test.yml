name: Test

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # SingleStepTests/65x02 commit the suite is verified against
  TESTS_REV: 2f6980a2d95757486c7bee24355c360e40e2a224

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache nes6502 test suite
        id: suite-cache
        uses: actions/cache@v4
        with:
          path: 65x02/nes6502/v1
          key: nes6502-v1-${{ env.TESTS_REV }}

      - name: Fetch nes6502 test suite
        if: steps.suite-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout --sparse https://github.com/SingleStepTests/65x02.git 65x02
          git -C 65x02 sparse-checkout set nes6502/v1
          git -C 65x02 checkout "$TESTS_REV"

      # release keeps the 1.1 GB of JSON parsing fast; overflow checks stay on
      - name: Run tests
        run: cargo test --release
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
